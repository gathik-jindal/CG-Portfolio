name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Static site: the landing page plus each project's index.html, served as-is.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          for p in A3 A4; do
            mkdir -p "_site/$p"
            cp -r "$p/index.html" "$p/src" "$p/assets" "$p/ss.png" "_site/$p/"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
